server:
  port: 8080

spring:
  datasource:
    url: "${DEV_DB_URL}"
    username: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate


logging:
  level:
    com.sprint.mission.discodeit: DEBUG
    org.springframework.security: TRACE
