server:
  port: 8080

spring:
  application:
    name: discodeit
  boot:
    admin:
      client:
        url: http://localhost:9090
  datasource:
    url: jdbc:postgresql://localhost:54322/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
    com.sprint.mission.discodeit: debug