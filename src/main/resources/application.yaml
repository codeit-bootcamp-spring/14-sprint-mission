spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

file.dir: /src/main/file/


file:
  upload-dir: ${user.home}/Desktop/mission-file/
