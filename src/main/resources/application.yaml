discodeit:
  storage:
    type: local
    local:
      root-path: src/main/java/com/sprint/mission/discodeit/storage/storage

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:54322/discodeit
    username: discodeit_user
    password: discodeit1234

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbbc.bind: TRACE