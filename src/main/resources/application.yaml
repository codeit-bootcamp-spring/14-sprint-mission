spring:
  application:
    name: discodeit
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:54322/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

# application.yaml
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage
  repository:
    type: file   # jcf | file\
    file-directory: .discodeit