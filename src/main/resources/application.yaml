spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # schema.sql을 직접 사용하므로 자동 생성은 끕니다.
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 정렬해서 출력합니다.
        use_sql_comments: true # SQL에 어떤 이유로 실행되었는지 주석을 남깁니다.

# 디버깅을 위한 SQL 및 파라미터 로그 레벨 설정
logging:
  level:
    org.hibernate.SQL: debug # 실행되는 실제 SQL 쿼리를 로그로 출력합니다.
    org.hibernate.orm.jdbc.bind: trace # SQL에 바인딩되는 ? 파라미터 값을 함께 출력합니다.

discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads  # 프로젝트 폴더 안의 'uploads' 폴더에 파일들을 저장하겠다는 뜻