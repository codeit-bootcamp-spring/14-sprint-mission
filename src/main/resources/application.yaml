spring:
  application:
    name: discodeit
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always


discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

logging:
  level:
    root: info