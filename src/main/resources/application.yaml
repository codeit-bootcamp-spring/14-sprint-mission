spring:
  application:
    name: discodeit
  profiles:
    default: prod
  servlet:
    multipart:
      max-file-size: 10MB # 파일 하나의 최대 크기
      max-request-size: 30MB # 한 번에 최대 업로드 가능 용량
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

discodeit:
  storage:
    type: database
    path: ${spring.datasource.url}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

info:
  app:
    name: Discodeit

logging:
  level:
    root: info
