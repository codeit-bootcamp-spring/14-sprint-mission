spring:
  application:
    name: discodeit
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/storage

logging:
  level:
    root: info