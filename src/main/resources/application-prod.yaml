spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/discodeit
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${SERVER_PORT:80}

logging:
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.SQL: debug

management:
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false