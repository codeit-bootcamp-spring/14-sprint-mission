spring:
  datasource:
    url: jdbc:h2:mem:discodeit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작 시 엔티티 기준으로 스키마를 새로 생성
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never   # schema.sql은 PostgreSQL 문법이라 테스트에서는 실행하지 않음

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

# 통합 테스트에서 업로드한 파일이 프로젝트 저장소를 더럽히지 않도록 build 아래에 저장
discodeit:
  storage:
    local:
      root-path: build/test-storage
