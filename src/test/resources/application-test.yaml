spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop

discodeit:
  storage:
    type: local
    local:
      root-path: build/test-storage

logging:
  level:
    com.sprint.mission.discodeit: debug
