discodeit:
  seed: true
  storage:
    type: local
    local:
      root-path: .discodeit/storage

spring:
  application:
    name: Discodeit
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
    encoding:
      charset: UTF-8
      force: true

springdoc:
  swagger-ui:
    tags-sorter: alpha          # Controller 알파벳 정렬
    operations-sorter: alpha    # URL 알파벳 정렬

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: Discodeit
