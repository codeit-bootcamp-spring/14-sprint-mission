discodeit:
  seed: true
  storage:
    type: local
    local:
      root-path: .discodeit/storage

spring:
  application:
    name: Discodeit
  servlet:
    encoding:
      charset: UTF-8
      force: true
  profiles:
    active: dev

springdoc:
  swagger-ui:
    tags-sorter: alpha          # Controller 알파벳 정렬
    operations-sorter: alpha    # URL 알파벳 정렬
