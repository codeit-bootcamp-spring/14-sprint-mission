spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        generate_statistics: true

discodeit:
  admin:
    username: ${DISCODEIT_ADMIN_USERNAME:admin}
    password: ${DISCODEIT_ADMIN_PASSWORD:admin1234}
    email: ${DISCODEIT_ADMIN_EMAIL:admin@discodeit.com}
  security:
    remember-me:
      key: ${DISCODEIT_REMEMBER_ME_KEY:dev-remember-me-key}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.security: trace

server:
  port: 8080