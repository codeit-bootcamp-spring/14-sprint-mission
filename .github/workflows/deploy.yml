name: Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  build-and-push:         # 깃헙 머신에서 이미지 빌드 + ecr 푸쉬
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR Public
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          ECR_REGISTRY="${ECR_REPOSITORY_URI%%/*}"
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          IMAGE_TAG: ${{ github.sha }}      # 빌드된 이미지 해시코드
        run: |
          docker build --platform linux/amd64 \
            --tag "$ECR_REPOSITORY_URI:latest" \
            --tag "$ECR_REPOSITORY_URI:$IMAGE_TAG" \
            .
          docker push "$ECR_REPOSITORY_URI:latest"
          docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"

  deploy:       # ECS api 호출
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Register task definition with new image    # 새로 릴리즈 이미지로 교체
        id: task-definition
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
          ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

          jq -e 'any(.containerDefinitions[]; .name == "discodeit-app")' \
            task-definition.json > /dev/null

          jq --arg image "$ECR_REPOSITORY_URI:$IMAGE_TAG" '
            (.containerDefinitions[] | select(.name == "discodeit-app") | .image) = $image
            | del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
          ' task-definition.json > updated-task-definition.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Stop current ECS service        # 현재 떠있는 스프링 컨테이너 내림
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Deploy new task definition
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --desired-count 1 \
            --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200" \
            --force-new-deployment

      - name: Wait for ECS deployment     # 실제 컨테이너 뜨는지
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"